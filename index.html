<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown & Math to Word Converter</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 2rem auto; padding: 1rem; background: #f8fafc; color: #333; line-height: 1.6; }
        textarea { width: 100%; height: 350px; padding: 1rem; font-family: monospace; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        button { background: #2563eb; color: white; border: none; padding: 12px 24px; font-size: 16px; font-weight: 600; border-radius: 8px; cursor: pointer; margin-top: 1rem; }
        button:hover { opacity: 0.9; }
        button:disabled { background: #94a3b8; cursor: not-allowed; }
        .status { margin-top: 1rem; padding: 1rem; border-radius: 8px; display: none; font-weight: 500; }
        .status.info { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; display: block; }
        .status.success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; display: block; }
        .status.error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    </style>
</head>
<body>

    <h1>Markdown & Math to Word</h1>
    <p>Paste your Gemini text below to generate a Word (.docx) file with editable math formulas.</p>

    <textarea id="input" placeholder="Paste markdown here..."></textarea>
    <br>
    <button id="convert-btn">Convert to .docx</button>
    <div id="status" class="status"></div>

    <script type="module">
        // Using esm.sh to bundle the markdown-docx library and bypass WebAssembly 404 errors
        import markdownDocx, { Packer } from 'https://esm.sh/markdown-docx@0.4.1?bundle';

        const btn = document.getElementById('convert-btn');
        const input = document.getElementById('input');
        const status = document.getElementById('status');

        function showStatus(msg, type = 'info') {
            status.className = 'status ' + type;
            status.innerText = msg;
        }

        btn.addEventListener('click', async () => {
            const text = input.value.trim();
            if (!text) {
                showStatus("Please paste some text first.", "error");
                return;
            }

            btn.disabled = true;
            showStatus("Converting document... Please wait.");

            try {
                // Convert Markdown & Math to a DOCX Document Object
                const doc = await markdownDocx(text);
                
                // Pack the Document Object into a downloadable Blob
                const blob = await Packer.toBlob(doc);
                
                // Download the file
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Converted_Math_Document.docx';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showStatus("Success! Your .docx file has been downloaded.", "success");
            } catch (err) {
                console.error(err);
                showStatus("Error during conversion: " + (err.message || err), "error");
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
